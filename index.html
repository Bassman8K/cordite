<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#06080b" />
    <meta name="description" content="CORDITE - a lightweight single-player tactical shooter. Six chapters, 300+ real-world weapons." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cordite" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>CORDITE</title>
    <style>
      html, body { margin: 0; height: 100%; background: #06080b; overflow: hidden; }
      #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #06080b; color: #ffb22e; font: 600 13px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.5em; z-index: 100; transition: opacity 0.5s; }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot i { display: block; width: 180px; height: 2px; margin: 18px auto 0; background: linear-gradient(90deg, transparent, #ffb22e, transparent); background-size: 50% 100%; background-repeat: no-repeat; animation: bootbar 1.1s linear infinite; }
      @keyframes bootbar { from { background-position: -100% 0; } to { background-position: 200% 0; } }
    </style>
  </head>
  <body>
    <canvas id="gl" tabindex="-1"></canvas>
    <div id="ui"></div>
    <div id="boot"><div>CORDITE<i></i></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
