name: Bug report
description: Something broke, looked wrong or ran badly.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown at the bottom-left of the main menu.
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Build
      options:
        - Browser (Play in browser)
        - Windows installer
        - Windows portable
        - macOS Apple Silicon
        - macOS Intel
        - Linux AppImage
        - Linux .deb
        - Android APK
        - iPhone / iPad (Home Screen)
        - iPhone / iPad (.ipa)
        - Built from source
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and system
      description: Model, operating system version and, on desktop, graphics card. For the browser build, which browser.
      placeholder: ThinkPad T14, Windows 11, Intel Iris Xe, Chrome 142
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where it happened
      options:
        - Menus
        - Armory
        - Settings
        - Chapter 1, Dead Water
        - Chapter 2, Shattered Mile
        - Chapter 3, Thin Air
        - Chapter 4, Furnace
        - Chapter 5, Black Site
        - Chapter 6, Last Light
        - Installing or starting the game
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead. Mention the objective you were on if it was in a chapter.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, recordings, the performance readout and your quality setting, or tester options that were on.
